# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: scorecard-intelligence-workbench
metadata:
  template: scorecard-intelligence-workbench@0.1.0
infra:
  provider: bicep
  path: infra
  module: azd
services:
  app:
    project: .
    language: js
    host: containerapp
    apiVersion: "2026-07-01"
    resourceGroup: ${AZURE_RESOURCE_GROUP}
    resourceName: ${AZURE_CONTAINER_APP_NAME}
    docker:
      path: Dockerfile
      context: .
      remoteBuild: true
hooks:
  preup:
    shell: pwsh
    run: ./infra/hooks/preup.ps1
    interactive: true
    continueOnError: false
  preprovision:
    shell: pwsh
    run: ./infra/hooks/preprovision.ps1
    interactive: true
    continueOnError: false
  postprovision:
    shell: pwsh
    run: ./infra/hooks/postprovision.ps1
    interactive: true
    continueOnError: false
  predeploy:
    shell: pwsh
    run: ./infra/hooks/preprovision.ps1
    interactive: true
    continueOnError: false
